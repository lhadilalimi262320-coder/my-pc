<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC - أداة التشخيص الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between p-4">

    <!-- شريط العنوان واللغات -->
    <header class="bg-gray-800 shadow-lg p-4 rounded-2xl border border-gray-700 max-w-3xl mx-auto w-full mt-2 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-extrabold text-cyan-400">My PC 💻</h1>
            <p class="text-gray-400 text-xs">أداة التشخيص المتقدمة لمواصفات وحالة حاسوبك</p>
        </div>
        <!-- أزرار اللغات -->
        <div class="flex gap-2">
            <button onclick="changeLang('ar')" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xs font-bold transition">العربية</button>
            <button onclick="changeLang('fr')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-bold transition">Français</button>
            <button onclick="changeLang('en')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-bold transition">English</button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-3xl mx-auto bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700 w-full my-4 space-y-6">
        
        <!-- قسم المواصفات -->
        <div>
            <h2 class="text-lg font-bold text-cyan-300 mb-3 border-b border-gray-700 pb-2" id="t-specs">اختر مواصفات جهازك بدقة:</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-300 text-xs mb-1 font-semibold">المعالج (CPU):</label>
                    <select id="cpu" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
                        <option value="Intel Core i3">Intel Core i3</option>
                        <option value="Intel Core i5" selected>Intel Core i5</option>
                        <option value="Intel Core i7">Intel Core i7</option>
                        <option value="AMD Ryzen 5">AMD Ryzen 5</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-300 text-xs mb-1 font-semibold">كارت الشاشة (GPU):</label>
                    <select id="gpu" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
                        <option value="Intel HD Graphics 630" selected>Intel HD Graphics 630</option>
                        <option value="NVIDIA GTX 1650">NVIDIA GTX 1650</option>
                        <option value="NVIDIA RTX 3060">NVIDIA RTX 3060</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-300 text-xs mb-1 font-semibold">الذاكرة العشوائية (RAM):</label>
                    <select id="ram" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
                        <option value="4 GB">4 GB</option>
                        <option value="8 GB" selected>8 GB</option>
                        <option value="16 GB">16 GB</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-300 text-xs mb-1 font-semibold">نوع التخزين (Storage):</label>
                    <select id="storage" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
                        <option value="HDD">HDD تقليدي</option>
                        <option value="SSD" selected>SSD سريع</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- المشاكل الشائعة -->
        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-lg font-bold text-yellow-400 mb-3" id="t-common">🛠️ المشاكل الشائعة (اضغط للحصول على الحل):</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="solveProblem('slow')" class="p-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-right text-xs transition cursor-pointer">⚠️ الجهاز بطيء جداً عند الاستخدام أو الإقلاع</button>
                <button onclick="solveProblem('games')" class="p-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-right text-xs transition cursor-pointer">🎮 الألعاب تقطع أو تعاني من Lag شديد</button>
                <button onclick="solveProblem('heat')" class="p-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-right text-xs transition cursor-pointer">🔥 ارتفاع حرارة المعالج وصوت المروحة العالي</button>
                <button onclick="solveProblem('net')" class="p-3 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-right text-xs transition cursor-pointer">🌐 انقطاع متكرر أو بطء شديد في الإنترنت</button>
            </div>
        </div>

        <!-- رفع الصور -->
        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-lg font-bold text-cyan-300 mb-2">📸 إرفاق صورة أو لقطة شاشة (Screenshot):</h2>
            <label class="w-full flex flex-col items-center px-4 py-4 bg-gray-900 text-cyan-400 rounded-xl border border-dashed border-cyan-500 cursor-pointer hover:bg-gray-700 transition">
                <span class="text-xs font-semibold">اضغط لاختيار صورة من جهازك</span>
                <input type="file" accept="image/*" class="hidden" onchange="previewImage(event)">
            </label>
            <div id="img-container" class="hidden mt-3 text-center">
                <p id="img-name" class="text-xs text-green-400 mb-2"></p>
                <img id="img-view" class="max-h-40 mx-auto rounded-lg border border-gray-700">
            </div>
        </div>

        <!-- كتابة المشكلة يدوياً -->
        <div class="border-t border-gray-700 pt-4">
            <h2 class="text-lg font-bold text-cyan-300 mb-2">✍️ أو اكتب مشكلتك بالتحديد هنا:</h2>
            <div class="space-y-3">
                <textarea id="custom-input" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500" placeholder="اكتب أي مشكلة تواجهك..."></textarea>
                <button onclick=" analyzeCustom()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-900 font-extrabold p-3 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer">
                    💡 تحليل المشكلة وإعطاء الحل الفوري
                </button>
            </div>
        </div>

        <!-- صندوق النتائج -->
        <div id="result-box" class="hidden p-4 bg-gray-900 border border-cyan-500/40 rounded-xl text-center space-y-2">
            <h3 class="text-base font-bold text-cyan-400">تقرير التشخيص والحل المقترح:</h3>
            <p id="result-text" class="text-gray-300 text-xs leading-relaxed"></p>
        </div>
    </main>

    <!-- الحقوق -->
    <footer class="text-center text-gray-500 text-xs py-2">
        جميع الحقوق محفوظة © My PC 2026
    </footer>

    <!-- السكريبت البرمجي المشغل لكل الأزرار -->
    <script>
        function solveProblem(type) {
            const box = document.getElementById('result-box');
            const text = document.getElementById('result-text');
            
            let solutions = {
                slow: "🔧 **حل مشكلة البطء:** تأكد من خلو قرص النظام (C) من الامتلاء، وقم بتعطيل برامج البدء التلقائي غير الضرورية من مدير المهام (Task Manager).",
                games: "🎮 **حل مشكلة الألعاب:** حدث تعريف كارت الشاشة لآخر إصدار، قلل جودة الرسوميات داخل اللعبة، وأغلق برامج الخلفية لتوفير الذاكرة (RAM).",
                heat: "🔥 **حل مشكلة الحرارة:** قم بتنظيف الأتربة المتراكمة داخل مروحة الحاسوب، وتأكد من تغيير المعجون الحراري (Thermal Paste).",
                net: "🌐 **حل مشاكل الإنترنت:** قم بإعادة تشغيل الراوتر، أو تأكد من سلامة تعريف كارت الشبكة Wi-Fi أو الكابل."
            };

            text.innerHTML = solutions[type] || "تم فحص النظام بنجاح.";
            box.classList.remove('hidden');
        }

        function analyzeCustom() {
            const input = document.getElementById('custom-input').value.trim();
            const box = document.getElementById('result-box');
            const text = document.getElementById('result-text');

            if (!input) {
                text.innerText = "⚠️ يرجى كتابة المشكلة في المربع أولاً!";
                box.classList.remove('hidden');
                return;
            }

            text.innerHTML = `✅ **تحليل المشكلة (${input}):** بناءً على وصفك، يُنصح بإعادة تشغيل الحاسوب وفحص ملفات النظام والتأكد من تحديث كافة التعريفات.`;
            box.classList.remove('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const container = document.getElementById('img-container');
                const nameElem = document.getElementById('img-name');
                const preview = document.getElementById('img-view');
                const box = document.getElementById('result-box');
                const text = document.getElementById('result-text');

                nameElem.innerText = `تم رفع الصورة بنجاح: ${file.name}`;
                preview.src = URL.createObjectURL(file);
                container.classList.remove('hidden');

                text.innerHTML = "📸 **تم استلام الصورة بنجاح:** تم فحص لقطة الشاشة، ننصح بمراجعة رسالة الخطأ الظاهرة والتأكد من توافق التعريفات.";
                box.classList.remove('hidden');
            }
        }

        function changeLang(lang) {
            alert(lang === 'ar' ? "تم التفعيل باللغة العربية" : "Language switched successfully");
        }
    </script>
</body>
</html>
