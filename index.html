<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC - روكي والمواصفات الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Navbar -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500/10 p-2 rounded-xl border border-cyan-500/20 text-cyan-400">
                    <i class="fa-solid fa-robot text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">My PC <span class="text-xs bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded-full border border-cyan-500/30">روكي AI</span></h1>
                    <p class="text-xs text-gray-400">منصة تشخيص العتاد ومساعدك الذكي روكي</p>
                </div>
            </div>
            
            <!-- Language Selector -->
            <div class="flex bg-gray-800 p-1 rounded-xl border border-gray-700 text-xs font-semibold">
                <button type="button" onclick="setLanguage('ar')" id="btn-ar" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white transition cursor-pointer">العربية</button>
                <button type="button" onclick="setLanguage('fr')" id="btn-fr" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 text-gray-400 transition cursor-pointer">Français</button>
                <button type="button" onclick="setLanguage('en')" id="btn-en" class="px-3 py-1.5 rounded-lg hover:text-cyan-400 text-gray-400 transition cursor-pointer">English</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full p-4 md:p-6 space-y-6 my-2">
        
        <!-- Hardware Specs Selection (Expanded with All Brands) -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold text-cyan-400 mb-4 flex items-center gap-2 border-b border-gray-800 pb-3">
                <i class="fa-solid fa-microchip"></i> حدد مواصفات حاسوبك بكل دقة (جميع البراندات):
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- CPU (All Brands) -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">المعالج (CPU):</label>
                    <select id="cpu" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <optgroup label="Intel Core الجيلات القديمة">
                            <option value="Intel Core i3 / i5 (2nd - 7th Gen)">Intel Core (الجيل 2 إلى 7)</option>
                        </optgroup>
                        <optgroup label="Intel Core الجيلات الحديثة">
                            <option value="Intel Core i3 (8th - 10th Gen)" selected>Intel Core i3 (الجيل 8 إلى 10)</option>
                            <option value="Intel Core i3 (11th - 14th Gen)">Intel Core i3 (الجيل 11 إلى 14)</option>
                            <option value="Intel Core i5 (8th - 11th Gen)">Intel Core i5 (الجيل 8 إلى 11)</option>
                            <option value="Intel Core i5 (12th - 14th Gen)">Intel Core i5 (الجيل 12 إلى 14)</option>
                            <option value="Intel Core i7 / i9 (10th - 14th Gen)">Intel Core i7 / i9 (فئات متقدمة)</option>
                        </optgroup>
                        <optgroup label="AMD Ryzen">
                            <option value="AMD Ryzen 3 Series">AMD Ryzen 3 Series</option>
                            <option value="AMD Ryzen 5 (3600 / 5600X / 7600)">AMD Ryzen 5 (إصدارات شهيرة)</option>
                            <option value="AMD Ryzen 7 / 9 Series">AMD Ryzen 7 / 9 Series (أداء عالي)</option>
                        </optgroup>
                    </select>
                </div>

                <!-- GPU (All Brands) -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">كارت الشاشة (GPU):</label>
                    <select id="gpu" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <optgroup label="Intel مدمج (Integrated)">
                            <option value="Intel HD Graphics 520/530/630" selected>Intel HD Graphics 520 / 530 / 630</option>
                            <option value="Intel Iris Xe Graphics">Intel Iris Xe Graphics</option>
                        </optgroup>
                        <optgroup label="NVIDIA GeForce GTX">
                            <option value="NVIDIA GeForce GTX 750 Ti / 960">NVIDIA GTX 750 Ti / 960</option>
                            <option value="NVIDIA GeForce GTX 1050 / 1050 Ti">NVIDIA GTX 1050 / 1050 Ti</option>
                            <option value="NVIDIA GeForce GTX 1650 / 1660 Super">NVIDIA GTX 1650 / 1660 Super</option>
                        </optgroup>
                        <optgroup label="NVIDIA GeForce RTX">
                            <option value="NVIDIA GeForce RTX 2060 / 2070">NVIDIA RTX 2060 / 2070</option>
                            <option value="NVIDIA GeForce RTX 3060 / 3070 / 3080">NVIDIA RTX 3060 / 3070 / 3080</option>
                            <option value="NVIDIA GeForce RTX 4060 / 4070 / 4090">NVIDIA RTX 40 series (4060 فما فوق)</option>
                        </optgroup>
                        <optgroup label="AMD Radeon">
                            <option value="AMD Radeon RX 570 / 580 / 5500XT">AMD Radeon RX 570 / 580 / 5500XT</option>
                            <option value="AMD Radeon RX 6600 / 6700 XT">AMD Radeon RX 6600 / 6700 XT</option>
                        </optgroup>
                    </select>
                </div>

                <!-- RAM -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">الذاكرة العشوائية (RAM):</label>
                    <select id="ram" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <option value="2 GB DDR2/DDR3">2 GB</option>
                        <option value="4 GB DDR3/DDR4">4 GB</option>
                        <option value="8 GB DDR3/DDR4" selected>8 GB</option>
                        <option value="16 GB DDR4/DDR5">16 GB</option>
                        <option value="32 GB أو أعلى">32 GB أو أعلى</option>
                    </select>
                </div>

                <!-- Storage -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">نوع التخزين (Storage):</label>
                    <select id="storage" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <option value="HDD">HDD تقليدي</option>
                        <option value="SSD" selected>SSD سريع</option>
                        <option value="NVMe M.2 SSD">NVMe M.2 فائق السرعة</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Quick Problems Fix (Fully Responsive Buttons) -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold text-amber-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-wrench"></i> حلول سريعة للمشاكل الشائعة:
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" onclick="quickFix('slow')" class="p-3 bg-gray-950 hover:bg-gray-800 border border-gray-800 rounded-xl text-right text-xs transition flex items-center justify-between group cursor-pointer">
                    <span>⚠️ بطء النظام والإقلاع</span>
                    <i class="fa-solid fa-chevron-left text-gray-600 group-hover:text-amber-400 transition"></i>
                </button>
                <button type="button" onclick="quickFix('games')" class="p-3 bg-gray-950 hover:bg-gray-800 border border-gray-800 rounded-xl text-right text-xs transition flex items-center justify-between group cursor-pointer">
                    <span>🎮 تقطيع الألعاب وانخفاض الـ FPS</span>
                    <i class="fa-solid fa-chevron-left text-gray-600 group-hover:text-amber-400 transition"></i>
                </button>
                <button type="button" onclick="quickFix('heat')" class="p-3 bg-gray-950 hover:bg-gray-800 border border-gray-800 rounded-xl text-right text-xs transition flex items-center justify-between group cursor-pointer">
                    <span>🔥 ارتفاع الحرارة وضوضاء المراوح</span>
                    <i class="fa-solid fa-chevron-left text-gray-600 group-hover:text-amber-400 transition"></i>
                </button>
                <button type="button" onclick="quickFix('net')" class="p-3 bg-gray-950 hover:bg-gray-800 border border-gray-800 rounded-xl text-right text-xs transition flex items-center justify-between group cursor-pointer">
                    <span>🌐 مشاكل وانقطاع شبكة الإنترنت</span>
                    <i class="fa-solid fa-chevron-left text-gray-600 group-hover:text-amber-400 transition"></i>
                </button>
            </div>
        </section>

        <!-- Upload Screenshot -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold text-cyan-400 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-image"></i> إرفاق صورة أو لقطة شاشة للخطأ:
            </h2>
            <p class="text-xs text-gray-400 mb-3">ارفع صورة الخطأ لتضمينها مع تقرير الفحص والحل:</p>
            
            <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-gray-700 hover:border-cyan-500 bg-gray-950 rounded-xl cursor-pointer transition">
                <i class="fa-solid fa-cloud-arrow-up text-2xl text-cyan-400 mb-2"></i>
                <span class="text-xs font-semibold text-gray-300">اضغط لاختيار صورة أو التقاطها من الجهاز</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleImage(event)">
            </label>

            <div id="img-preview-box" class="hidden mt-3 p-3 bg-gray-950 rounded-xl border border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img id="img-preview" class="w-12 h-12 object-cover rounded-lg border border-gray-700">
                    <span id="img-name" class="text-xs text-green-400 truncate max-w-xs"></span>
                </div>
                <button type="button" onclick="removeImage()" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
            </div>
        </section>

        <!-- AI Interactive Hardware Chatbot (Rocky) -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 class="text-base font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-robot"></i> الشات الذكي مع الروبوت روكي (Rocky AI):
                </h2>
                <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full border border-green-500/30 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span> روكي متصل الآن
                </span>
            </div>

            <!-- Chat Window -->
            <div id="chat-window" class="h-64 overflow-y-auto bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-3 text-xs">
                <!-- Welcome Bot Msg -->
                <div class="flex gap-2.5 items-start">
                    <div class="w-7 h-7 rounded-lg bg-cyan-600 flex items-center justify-center text-white shrink-0 font-bold">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div
