<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC - أداة تشخيص الحاسوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between p-4">

    <!-- شريط العنوان العلوي -->
    <header class="bg-gray-800 shadow-lg p-6 rounded-2xl border border-gray-700 text-center max-w-2xl mx-auto w-full mt-4">
        <h1 class="text-3xl font-extrabold text-cyan-400 mb-1">My PC 💻</h1>
        <p class="text-gray-400 text-sm">أداة التشخيص الذكي واختيار مواصفات جهازك</p>
    </header>

    <!-- بطاقة الفحص الرئيسية -->
    <main class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700 w-full my-6">
        <h2 class="text-xl font-bold text-cyan-300 mb-4 border-b border-gray-700 pb-2">حدد مواصفات جهازك الحالية:</h2>

        <div class="space-y-4">
            <!-- المعالج -->
            <div>
                <label class="block text-gray-300 text-sm mb-1 font-semibold">المعالج (CPU):</label>
                <select id="cpu" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="Intel Core i3 (10th Gen)">Intel Core i3 (10th Gen)</option>
                    <option value="Intel Core i5 (12th Gen)">Intel Core i5 (12th Gen)</option>
                    <option value="Intel Core i7 (13th Gen)">Intel Core i7 (13th Gen)</option>
                    <option value="AMD Ryzen 5 5600X">AMD Ryzen 5 5600X</option>
                </select>
            </div>

            <!-- كارت الشاشة -->
            <div>
                <label class="block text-gray-300 text-sm mb-1 font-semibold">كارت الشاشة (GPU):</label>
                <select id="gpu" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="Intel HD Graphics 630">Intel HD Graphics 630</option>
                    <option value="NVIDIA GTX 1650">NVIDIA GTX 1650</option>
                    <option value="NVIDIA RTX 3060">NVIDIA RTX 3060</option>
                </select>
            </div>

            <!-- الرام -->
            <div>
                <label class="block text-gray-300 text-sm mb-1 font-semibold">الذاكرة العشوائية (RAM):</label>
                <select id="ram" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="8 GB" selected>8 GB</option>
                    <option value="16 GB">16 GB</option>
                    <option value="32 GB">32 GB</option>
                </select>
            </div>

            <!-- زر التفاعل -->
            <button onclick="runDiagnostic()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-900 font-extrabold p-3 rounded-xl shadow-lg transition duration-200 mt-4">
                إجراء فحص وتشخيص سريع 🔍
            </button>
        </div>

        <!-- نتيجة التفاعل -->
        <div id="result-box" class="hidden mt-6 p-4 bg-gray-900 border border-cyan-500/40 rounded-xl text-center">
            <h3 class="text-lg font-bold text-cyan-400 mb-1">نتيجة التقرير:</h3>
            <p id="result-text" class="text-gray-300"></p>
        </div>
    </main>

    <!-- الحقوق -->
    <footer class="text-center p-4 text-gray-500 text-xs">
        جميع الحقوق محفوظة © My PC 2026
    </footer>

    <script>
        function runDiagnostic() {
            const cpu = document.getElementById('cpu').value;
            const gpu = document.getElementById('gpu').value;
            const ram = document.getElementById('ram').value;

            const box = document.getElementById('result-box');
            const text = document.getElementById('result-text');

            text.innerText = `تم اختيار: (${cpu} | ${gpu} | ${ram}). الجهاز جاهز ومستقر لتشغيل النظام والمهام اليومية بنجاح!`;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
